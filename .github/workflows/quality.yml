name: Quality & security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify i18n keys and security markers
        run: node scripts/check.js
      - name: Fail if secrets or forbidden patterns slipped in
        run: |
          ! grep -rInE "(api[_-]?key|secret|password\s*[:=]|BEGIN (RSA|OPENSSH) PRIVATE)" --include=*.html --include=*.js --include=*.css . || (echo "Possible secret found" && exit 1)
          ! grep -rInE "<script[^>]+src=[\"']https?://" index.html || (echo "External script not allowed by CSP" && exit 1)
